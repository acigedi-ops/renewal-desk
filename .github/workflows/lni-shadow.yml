# Free L&I check (no Claude), in shadow mode: compares its result with what the L&I routine saved and writes
# meta/lni_shadow. It never changes a client. Runs within about an hour after each L&I routine run (8:50, 12:50, 17:50 Pacific),
# in summer and winter time alike, so both read the same L&I data.
# Needs the repository secret SUPABASE_SECRET_KEY (Settings > Secrets and variables > Actions); without it the job skips.
name: L&I shadow check
on:
  schedule:
    - cron: "5 17 * * *"    # 10:05 PDT / 9:05 PST
    - cron: "5 21 * * *"    # 14:05 PDT / 13:05 PST
    - cron: "5 2 * * *"     # 19:05 PDT / 18:05 PST
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compare with the routine's L&I data
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          if [ -z "$SUPABASE_SECRET_KEY" ]; then echo "SUPABASE_SECRET_KEY is not set; skipping."; exit 0; fi
          python3 tools/lni_shadow.py
